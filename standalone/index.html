.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:max(16px,env(safe-area-inset-top)) 20px 0;max-width:480px;margin:0 auto}
.app-name{font-size:12px;font-weight:900;letter-spacing:0.08em;color:rgba(255,255,255,0.92);text-shadow:0 1px 4px rgba(0,0,0,0.5)}
.level-tag{font-size:11px;font-weight:700;color:#FDF4E7;background:rgba(184,106,0,0.85);backdrop-filter:blur(4px);padding:4px 12px;border-radius:var(--radius-full)}
.signboard{margin:14px auto 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 26px;background:linear-gradient(180deg,#7A5230,#5C3B20);border:2px solid #3E2914;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,0.35)}
.signboard-title{font-size:21px;font-weight:900;color:#FDF4E7;letter-spacing:0.04em;text-shadow:0 2px 3px rgba(0,0,0,0.4)}
.signboard-sub{font-size:11px;font-weight:700;color:#E5CBA0;letter-spacing:0.03em}
.machine-section{padding-top:18px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.machine{position:relative;width:clamp(170px,46vw,220px)}
.machine-svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 14px 28px rgba(0,0,0,0.45))}
.dome-pulse{animation:domePulse 2.6s ease-in-out infinite}
@keyframes domePulse{0%,100%{stroke:#0D2118}50%{stroke:#6C9A5E}}
.capsule-idle{animation:capsuleBob 4.2s ease-in-out infinite;transform-origin:center}
@keyframes capsuleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.knob-group{cursor:pointer;transform-origin:130px 192px;outline:none}
.knob-idle{animation:knobHint 3s ease-in-out infinite}
@keyframes knobHint{0%,65%,100%{transform:rotate(0deg)}78%{transform:rotate(18deg)}90%{transform:rotate(-6deg)}}
#page-home.phase-pulling .capsule-field{animation:capsuleJiggle 0.62s ease-in-out}
@keyframes capsuleJiggle{0%{transform:rotate(0deg)}25%{transform:rotate(6deg)}50%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0deg)}}
#page-home.phase-pulling .knob-group{animation:knobTurn 0.68s cubic-bezier(0.4,0,0.2,1)}
@keyframes knobTurn{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.machine-status{min-height:20px;margin-top:10px;color:rgba(255,255,255,0.85);font-size:11px;font-weight:700;letter-spacing:0.08em;text-shadow:0 1px 4px rgba(0,0,0,0.5);padding:4px 14px;background:rgba(9,17,12,0.32);border-radius:var(--radius-full)}
.control-panel{width:100%;max-width:480px;margin:18px auto 0;padding:0 20px}
.saved-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:rgba(255,255,255,0.94);backdrop-filter:blur(6px);border-radius:var(--radius-md);box-shadow:var(--shadow-md);margin-bottom:14px}
.saved-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saved-text{font-size:13px;font-weight:700;color:var(--ink)}
.saved-sep{color:var(--ink-3)}
.change-btn{font-size:12px;font-weight:700;color:var(--g);background:var(--g-tint);border:none;padding:6px 14px;border-radius:var(--radius-full);flex-shrink:0}
.config-block{background:rgba(255,255,255,0.94);backdrop-filter:blur(6px);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:16px 16px 6px;margin-bottom:14px}
.config-section{margin-bottom:18px}
.config-label{font-size:10px;font-weight:700;letter-spacing:0.12em;color:var(--ink-3);margin-bottom:10px;display:block}
.any-row{margin-bottom:8px}

const SK='gunma_gacha_state',PK='gunma_gacha_prefs';
const DEF={visits:[],totalPoints:0,currentSpotId:null,currentTransport:null,currentStyle:null};
function loadState(){try{const r=localStorage.getItem(SK);return r?{...DEF,...JSON.parse(r)}:{...DEF}}catch{return{...DEF}}}
function saveState(s){localStorage.setItem(SK,JSON.stringify(s))}
function addVisit(v){const s=loadState();const i=s.visits.findIndex(x=>x.spotId===v.spotId);if(i>=0)s.visits[i]=v;else s.visits.push(v);s.totalPoints=s.visits.reduce((a,x)=>a+x.points,0);saveState(s);return s}
function updateCurrentSpot(id,t,st){const s=loadState();s.currentSpotId=id;s.currentTransport=t;s.currentStyle=st;saveState(s)}
function getVisitedIds(){return loadState().visits.map(v=>v.spotId)}
function getVisitBySpotId(id){return loadState().visits.find(v=>v.spotId===id)}
function savePref(t,st){localStorage.setItem(PK,JSON.stringify({transports:t,style:st}))}
function loadPref(){try{const r=localStorage.getItem(PK);if(!r)return null;const p=JSON.parse(r);if(typeof p.transport==='string'&&!p.transports)return{transports:[p.transport],style:p.style};if(typeof p.transports==='string'&&p.transports!=='any')return{transports:[p.transports],style:p.style};return p}catch{return null}}

/* ═══ GACHA LOGIC ═══ */
function haversine(la1,lo1,la2,lo2){const R=6371,r=d=>d*Math.PI/180,dLa=r(la2-la1),dLo=r(lo2-lo1),a=Math.sin(dLa/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function transportOK(spot,tr,dist){if(tr==='any')return true;return tr.some(t=>spot.transports.includes(t)&&dist<=TRANSPORT_MAX[t])}
function drawGacha(tr,st,visited,uLat,uLng){const fromLat=uLat??DEFAULT_LAT,fromLng=uLng??DEFAULT_LNG;const cats=STYLE_CAT[st];const vis=new Set(visited);let cands=SPOTS.filter(s=>{if(vis.has(s.id))return false;const d=haversine(fromLat,fromLng,s.lat,s.lng);if(!transportOK(s,tr,d))return false;if(cats.length>0&&!s.categories.some(c=>cats.includes(c)))return false;return true});if(!cands.length)cands=SPOTS.filter(s=>{const d=haversine(fromLat,fromLng,s.lat,s.lng);return transportOK(s,tr,d)});if(!cands.length)return null;return cands[Math.floor(Math.random()*cands.length)]}
function eligibleCount(tr,uLat,uLng){if(tr==='any')return SPOTS.length;const fLa=uLat??DEFAULT_LAT,fLo=uLng??DEFAULT_LNG;return SPOTS.filter(s=>{const d=haversine(fLa,fLo,s.lat,s.lng);return transportOK(s,tr,d)}).length}
function choosePrimaryTransport(spot,tr){const ORDER=['car','train','bicycle','walking'];if(tr==='any')return ORDER.find(t=>spot.transports.includes(t))||'car';return ORDER.find(t=>tr.includes(t)&&spot.transports.includes(t))||tr[0]}
function currentLevel(pts){return[...LEVEL_THRESHOLDS].reverse().find(l=>pts>=l.minPoints)||LEVEL_THRESHOLDS[0]}
function fmt(iso){const d=new Date(iso);return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}

function toggleTransport(t){
  if(homeTransports==='any'){homeTransports=[t];}
  else{const has=homeTransports.includes(t);if(has&&homeTransports.length===1)return;homeTransports=has?homeTransports.filter(x=>x!==t):[...homeTransports,t]}
  savePref(homeTransports,homeStyle);renderHome();
}

function handleGacha(){
  if(homePhase!=='idle')return;
  const state=loadState();const vis=getVisitedIds();
  const isLocked=!!state.currentSpotId&&!vis.includes(state.currentSpotId);
  if(isLocked)return;
  const spot=drawGacha(homeTransports,homeStyle,vis,userLat,userLng);
  if(!spot){homeError='条件に合うスポットが見つかりません。設定を変えてみてください。';renderHome();return}
  homeError='';homeDrawn=spot;homeSettingsOpen=false;
  const pt=choosePrimaryTransport(spot,homeTransports);
  updateCurrentSpot(spot.id,pt,homeStyle);
  setPhase('pulling');
  gTimers.forEach(clearTimeout);
  gTimers=[
    setTimeout(()=>setPhase('drop'),480),
    setTimeout(()=>setPhase('shake'),1380),
    setTimeout(()=>{setPhase('open');homeCapsuleOpen=true;renderHome()},2080),
    setTimeout(()=>setPhase('reveal'),2700)
  ];
}

function setPhase(p){
  homePhase=p;
  const el=document.getElementById('page-home');
  if(!el)return;
  el.className='page';
  if(p!=='idle')el.classList.add('phase-'+p);
  const st=el.querySelector('.machine-status');
  if(st)st.textContent={idle:'つまみを回してね',pulling:'ガチャ回転中...',shake:'どんな場所かな...',open:'開封中',reveal:''}[p]||'';
  if(p==='pulling'){
    // hide controls and stats during animation - will be re-rendered on phase change
  }
  if(p==='open'){
    const cs=el.querySelector('.capsule-section');if(cs)cs.style.display='';
    const ct=el.querySelector('.capsule-top');if(ct)ct.classList.add('open');
    const glow=el.querySelector('.open-glow');
  }
  if(p==='reveal')renderHome();
}

        <span class="sec-label">PHOTO</span>
        <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
        ${mPhoto?`<div class="photo-wrap"><img src="${mPhoto}" alt="訪問写真" class="photo-img"><button class="photo-retake" onclick="document.getElementById('photo-input').click()">撮り直す</button></div>`:`<button class="photo-add" onclick="document.getElementById('photo-input').click()"><span class="photo-add-icon">📷</span><span class="photo-add-text">写真を追加</span></button>`}
      </div>
      <div class="mission-section">
        <span class="sec-label">MEMO</span>
        <textarea class="memo-textarea" rows="3" placeholder="今日の旅の感想…" oninput="mComment=this.value">${mComment}</textarea>
      </div>
    </div>
    <div class="action-bar">
      <button class="record-btn${allDone?' gold':''}" onclick="recordVisit()">
        ${allDone?`記録して次の冒険へ  +${spot.points}pt`:'訪問を記録する'}
      </button>
    </div>`;
}
function toggleMission(i){mCompleted[i]=!mCompleted[i];renderMission()}
function handlePhoto(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{mPhoto=ev.target.result;renderMission()};r.readAsDataURL(f);
}
function recordVisit(){
  const state=loadState();const spotId=state.currentSpotId;const spot=getSpotById(spotId);if(!spot)return;
  const allDone=mCompleted.every(Boolean);const doneCount=mCompleted.filter(Boolean).length;
  const visit={id:`${spotId}-${Date.now()}`,spotId:spot.id,visitDate:new Date().toISOString(),transportType:state.currentTransport||'car',missionsCompleted:[...mCompleted],comment:mComment,points:allDone?spot.points:Math.round(spot.points*(doneCount/spot.missions.length))};
  addVisit(visit);mCompleted=[];mComment='';mPhoto=null;navigate('home');
}

/* ═══ HISTORY PAGE ═══ */
function renderHistory(){
  const state=loadState();const{visits,totalPoints}=state;
  const ts=SPOTS.length,vc=visits.length,pct=Math.round(vc/ts*100);
  const cl=currentLevel(totalPoints);
  const nl=LEVEL_THRESHOLDS.find(l=>l.minPoints>totalPoints);
  const nPct=nl?Math.round(((totalPoints-cl.minPoints)/(nl.minPoints-cl.minPoints))*100):100;
  const sorted=[...visits].sort((a,b)=>new Date(b.visitDate)-new Date(a.visitDate));
  const el=document.getElementById('page-history');
  el.innerHTML=`
    <div class="history-header">
      <div class="history-header-inner">
        <div class="history-top-row">
          <h1 class="history-title">📖 旅の記録</h1>
          <div class="level-badge">
            <span class="level-num">Lv.${cl.level}</span>
            <span class="level-title-text">${cl.title}</span>
          </div>
        </div>
        <div class="stats-cards-row">
          <div class="stat-card-h"><span class="stat-num-h">${totalPoints.toLocaleString()}</span><span class="stat-label-h">獲得ポイント</span></div>
          <div class="stat-card-h"><span class="stat-num-h">${vc}</span><span class="stat-label-h">訪問スポット</span></div>
          <div class="stat-card-h"><span class="stat-num-h">${pct}%</span><span class="stat-label-h">群馬制覇率</span></div>
        </div>
        ${nl?`<p class="pt-next">Lv.${cl.level+1}「${nl.title}」まで ${nl.minPoints-totalPoints}pt</p>`:''}
        <div class="progress-bar-h"><div class="progress-fill-h" style="width:${nPct}%"></div></div>
      </div>
    </div>
    <main class="history-main">
      ${vc===0?`
      <div class="history-empty">
        <span class="history-empty-icon">🗺️</span>
        <h2 class="history-empty-title">まだ旅の記録がありません</h2>
        <p class="history-empty-text">ガチャを回して群馬の知らないスポットへ出かけよう。<br>訪問するとここに思い出が積み重なっていきます。</p>
        <button class="start-btn" onclick="navigate('home')">最初のガチャを回す 🎲</button>
      </div>
      `:`
      <div class="visit-list">
        ${sorted.map(v=>{const spot=getSpotById(v.spotId);if(!spot)return'';const allD=v.missionsCompleted.every(Boolean);const dc=v.missionsCompleted.filter(Boolean).length;return`
        <div class="visit-card">
          <div class="visit-body">
            <div class="visit-top">
              <h3 class="visit-name">${spot.name}</h3>
              <span class="visit-pts">+${v.points}pt</span>
            </div>
            <p class="visit-meta">${fmt(v.visitDate)} · ${TRANSPORT_LABELS[v.transportType]} · ${spot.area}</p>
            <div class="missions-row">
              <div class="mission-icons">${v.missionsCompleted.map(d=>d?'✅':'⬜').join('')}</div>
              <span class="mission-label${allD?' complete':''}">${allD?'コンプリート！':`${dc}/${spot.missions.length}達成`}</span>
            </div>
            ${v.comment?`<p class="visit-comment">💬 ${v.comment}</p>`:''}
            <button class="revisit-btn" onclick="updateCurrentSpot('${spot.id}','${v.transportType}','random');navigate('mission')">詳細・再訪問 →</button>
          </div>
        </div>`}).join('')}
      </div>
      `}
    </main>`;
}
/* ═══ MAP PAGE ═══ */
const GUNMA_BOUNDARY=[[36.597728,138.428667],[36.434211,138.401228],[36.404751,138.459646],[36.409282,138.647831],[36.303115,138.653527],[36.2784,138.600332],[36.172067,138.636339],[36.168074,138.577271],[36.120197,138.645374],[36.027054,138.631962],[35.985333,138.712547],[36.034526,138.754408],[36.037303,138.828391],[36.124399,138.958478],[36.127940,139.041829],[36.283398,139.129659],[36.244434,139.244062],[36.235839,139.320899],[36.253339,139.359765],[36.189204,139.464262],[36.210375,139.587398],[36.186572,139.624883],[36.213247,139.669944],[36.271166,139.632485],[36.272104,139.462710],[36.368804,139.367364],[36.465976,139.436468],[36.550686,139.439039],[36.581883,139.483522],[36.627668,139.329552],[36.746266,139.372458],[36.773610,139.353049],[36.827043,139.406701],[36.852741,139.348518],[36.907072,139.395503],[36.929407,139.240657],[37.058627,139.097008],[36.987294,139.047381],[36.979076,138.966547],[36.891177,138.979161],[36.883600,138.923142],[36.832614,138.929016],[36.817627,138.821738],[36.761586,138.817764],[36.764169,138.727022],[36.690786,138.514330],[36.655289,138.529439],[36.597728,138.428667]];

function createMarkerIcon(color,visited){
  const size=visited?14:10,border=visited?3:2;
  return L.divIcon({className:'',html:`<div style="width:${size}px;height:${size}px;background:${visited?color:'#d1d5db'};border:${border}px solid ${visited?'white':'#9ca3af'};border-radius:50%;box-shadow:${visited?`0 0 0 2px ${color}40,0 2px 8px rgba(0,0,0,0.3)`:'0 1px 4px rgba(0,0,0,0.2)'}"></div>`,iconSize:[size+border*2,size+border*2],iconAnchor:[(size+border*2)/2,(size+border*2)/2]});
}

function renderMap(){
  const state=loadState();const visitedSet=new Set(state.visits.map(v=>v.spotId));
  const vc=state.visits.length,ts=SPOTS.length,pct=Math.round(vc/ts*100);
  const el=document.getElementById('page-map');
  const catFilters=[{key:'all',label:'すべて'},{key:'nature',label:'🏞 自然'},{key:'onsen',label:'♨️ 温泉'},{key:'history',label:'🏛 歴史'},{key:'gourmet',label:'🍴 グルメ'},{key:'leisure',label:'🎡 レジャー'},{key:'urban',label:'🏙 街'}];

  el.innerHTML=`
    <div class="map-header">
      <h1 class="map-title">🗺️ 群馬探索マップ</h1>
      <div class="stats-row-m">
        <div class="stat-item-m"><span class="stat-num-m">${vc}</span><span class="stat-label-m">訪問済み</span></div>
        <div class="stat-divider-m"></div>
        <div class="stat-item-m"><span class="stat-num-m">${ts-vc}</span><span class="stat-label-m">未訪問</span></div>
        <div class="stat-divider-m"></div>
        <div class="stat-item-m"><span class="stat-num-m">${pct}%</span><span class="stat-label-m">制覇率</span></div>
      </div>
      <div class="progress-bar-m"><div class="progress-fill-m" style="width:${pct}%"></div></div>
    </div>
    <div class="filter-section">
      <div class="filter-row">
        ${catFilters.map(f=>`<button class="filter-btn${mapCatFilter===f.key?' active':''}" onclick="mapCatFilter='${f.key}';updateMapMarkers()">${f.label}</button>`).join('')}
      </div>
      <div class="toggle-row">
        ${['all','visited','unvisited'].map(v=>`<button class="toggle-btn${mapVisFilter===v?' active':''}" onclick="mapVisFilter='${v}';updateMapMarkers()">${v==='all'?'すべて':v==='visited'?'✅ 訪問済み':'⬜ 未訪問'}</button>`).join('')}
      </div>
    </div>
    <div class="map-wrapper"><div id="map-container"></div></div>
    <div class="map-legend">
      ${Object.entries(CATEGORY_COLORS).map(([cat,color])=>`<div class="legend-item"><div class="legend-dot" style="background:${color}"></div><span class="legend-label">${CATEGORY_LABELS[cat].replace(/^.+ /,'')}</span></div>`).join('')}
      <div class="legend-item"><div class="legend-dot" style="background:#d1d5db"></div><span class="legend-label">未訪問</span></div>
    </div>
    <div class="area-section">
      <h3 class="area-section-title">エリア別制覇率</h3>
      <div class="area-grid">
        ${AREAS.map(area=>{const aSpots=SPOTS.filter(s=>s.area===area);const aVis=aSpots.filter(s=>visitedSet.has(s.id)).length;const aPct=aSpots.length>0?Math.round(aVis/aSpots.length*100):0;const col=aPct>=100?'#d97706':aPct>50?'#15803d':'#6b7280';return`<div class="area-item"><div class="area-top"><span class="area-name">${area}</span><span class="area-pct-val" style="color:${col}">${aPct}%</span></div><div class="area-bar"><div class="area-fill" style="width:${aPct}%;background:${aPct>=100?'#d97706':'#15803d'}"></div></div><span class="area-count">${aVis}/${aSpots.length}スポット</span></div>`}).join('')}
      </div>
    </div>`;

  // Init Leaflet
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({iconRetinaUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',iconUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'});

  if(leafMap){leafMap.remove();leafMap=null}
  leafMap=L.map('map-container',{center:[36.55,138.95],zoom:9,minZoom:8,maxBounds:[[35.85,138.20],[37.15,139.90]],maxBoundsViscosity:1.0,zoomControl:true,attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafMap);
  L.polyline(GUNMA_BOUNDARY,{color:'#1D5035',weight:2.5,opacity:0.75}).addTo(leafMap);

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      L.circleMarker([pos.coords.latitude,pos.coords.longitude],{radius:9,fillColor:'#1D5035',fillOpacity:0.9,color:'white',weight:2}).addTo(leafMap);
    },()=>{},{timeout:8000,maximumAge:300000});
  }

  updateMapMarkers();
}

function updateMapMarkers(){
  if(!leafMap)return;
  const state=loadState();const visitedSet=new Set(state.visits.map(v=>v.spotId));
  // Remove old markers
  leafMap.eachLayer(layer=>{if(layer instanceof L.Marker)leafMap.removeLayer(layer)});

  // Update filter button states
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.textContent.trim()===(['すべて','🏞 自然','♨️ 温泉','🏛 歴史','🍴 グルメ','🎡 レジャー','🏙 街'].find((l,i)=>{const keys=['all','nature','onsen','history','gourmet','leisure','urban'];return keys[i]===mapCatFilter})||''));
  });
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    const labels={all:'すべて',nature:'🏞 自然',onsen:'♨️ 温泉',history:'🏛 歴史',gourmet:'🍴 グルメ',leisure:'🎡 レジャー',urban:'🏙 街'};
    btn.classList.toggle('active',btn.textContent.trim()===labels[mapCatFilter]);
  });
  document.querySelectorAll('.toggle-btn').forEach(btn=>{
    const labels={all:'すべて',visited:'✅ 訪問済み',unvisited:'⬜ 未訪問'};
    btn.classList.toggle('active',btn.textContent.trim()===labels[mapVisFilter]);
  });

  const filtered=SPOTS.filter(s=>{
    if(mapCatFilter!=='all'&&!s.categories.includes(mapCatFilter))return false;
    if(mapVisFilter==='visited'&&!visitedSet.has(s.id))return false;
    if(mapVisFilter==='unvisited'&&visitedSet.has(s.id))return false;
    return true;
  });

  filtered.forEach(spot=>{
    const visited=visitedSet.has(spot.id);
    const color=CATEGORY_COLORS[spot.categories[0]];
    const icon=createMarkerIcon(color,visited);
    const mUrl=`https://maps.google.com/?q=${spot.lat},${spot.lng}`;
    const popHtml=`<div class="popup-content">
      <div class="popup-cats">
        ${spot.categories.map(c=>`<span class="popup-cat" style="background:${CATEGORY_COLORS[c]}20;color:${CATEGORY_COLORS[c]}">${CATEGORY_LABELS[c]}</span>`).join('')}
        ${visited?'<span class="popup-visited">✅ 訪問済み</span>':''}
      </div>
      <h3 class="popup-name">${spot.name}</h3>
      <p class="popup-area">📍 ${spot.area}</p>
      <p class="popup-desc">${spot.description}</p>
      <a href="${mUrl}" target="_blank" rel="noopener noreferrer" class="popup-maps-link">🗺️ Googleマップで見る</a>
      <button class="popup-go-btn" style="background:${visited?'#f0fdf4':color}" onclick="updateCurrentSpot('${spot.id}','car','random');navigate('mission')" >
        ${visited?`<span style="color:${color};font-weight:800">旅の記録を見る →</span>`:'<span style="color:white;font-weight:800">ここへ行く →</span>'}
      </button>
    </div>`;
    L.marker([spot.lat,spot.lng],{icon}).addTo(leafMap).bindPopup(popHtml,{maxWidth:260});
  });
}

/* ═══ INIT ═══ */
function init(){
  const prefs=loadPref();
  if(prefs){homeTransports=prefs.transports;homeStyle=prefs.style;homeSettingsOpen=false}
  else{homeSettingsOpen=true}

  if(navigator.geolocation){
    locStatus='pending';
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat=pos.coords.latitude;userLng=pos.coords.longitude;locStatus='granted';
      if(curPage==='home')renderHome();
    },()=>{locStatus='denied'},{timeout:8000,maximumAge:300000});
  } else{locStatus='denied'}

  navigate('home');
}
init();
</script>
